name: Playwright CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TEST_ENV: ${{ vars.TEST_ENV || 'dev' }}
      TEST_BRAND: ${{ vars.TEST_BRAND || 'brandA' }}
      BROWSER: ${{ vars.BROWSER || 'chromium' }}
      HEADLESS: ${{ vars.HEADLESS || 'true' }}
      WORKERS: ${{ vars.WORKERS || '2' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply optional runtime overrides
        shell: bash
        run: |
          if [ -n "${{ vars.BASE_URL }}" ]; then
            echo "BASE_URL=${{ vars.BASE_URL }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ vars.API_BASE_URL }}" ]; then
            echo "API_BASE_URL=${{ vars.API_BASE_URL }}" >> "$GITHUB_ENV"
          fi
        # Add more optional values here later if you want repo or environment variables
        # to override the framework defaults without changing provider logic.

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ env.BROWSER }}

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Clean previous artifacts
        run: npm run clean

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results and attachments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 14
